spring.application.name=SCANPLUS UNIFIED POS SECURITY
server.address=${SCANPLUS_BIND:127.0.0.1}
server.port=${SCANPLUS_PORT:9443}
server.forward-headers-strategy=none
server.error.include-message=never
server.error.include-stacktrace=never
spring.datasource.url=${SCANPLUS_DATABASE:jdbc:h2:file:./var/scanplus;AUTO_SERVER=FALSE}
spring.datasource.username=sa
spring.datasource.password=${SCANPLUS_DB_PASSWORD:}
spring.sql.init.mode=always
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.servlet.multipart.enabled=false
server.tomcat.max-http-form-post-size=16KB
server.max-http-request-header-size=8KB
scanplus.admin-token=${SCANPLUS_ADMIN_TOKEN:}
scanplus.require-tls=${SCANPLUS_REQUIRE_TLS:true}
logging.level.org.springframework.jdbc=INFO
