apply plugin: 'com.android.application'
android {
    namespace 'com.example.hardware'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.velox.hardwaresecurity'
        minSdk 25
        targetSdk 25
        versionCode 5
        versionName '2.0.2-a920'
        testInstrumentationRunner 'com.example.hardware.HardwareSmokeRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    signingConfigs {
        owner {
            def props = new Properties()
            def source = rootProject.file('signing.properties')
            if (source.exists()) {
                source.withInputStream { props.load(it) }
                storeFile file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }
    buildTypes {
        release { minifyEnabled false; debuggable false; signingConfig signingConfigs.owner }
    }
    testBuildType 'release'
    applicationVariants.all { variant ->
        variant.outputs.all { outputFileName = rootProject.hasProperty('veloxCandidate') ? 'Velox-Hardware-Security-candidate.apk' : 'Velox-Hardware-Security.apk' }
    }
    lint {
        abortOnError true
        // Dedicated Android 7.1 test-terminal build, distributed directly.
        disable 'ExpiredTargetSdkVersion'
    }
}
